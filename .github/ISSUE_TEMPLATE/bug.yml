name: Bug report
description: Report a reproducible TBH Core problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: TBH Core version
  - type: input
    id: game-version
    attributes:
      label: Task Bar Hero version
  - type: dropdown
    id: source
    attributes:
      label: Affected data source
      options:
        - UI only
        - Save
        - Memory
        - Player.log
        - Reconciliation / unknown
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / logs
      description: Remove any information you do not want to share publicly.
