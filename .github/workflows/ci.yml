name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --no-frozen-lockfile
      # memory-reader helper: tests + self-contained build (fails the job on breakage)
      - run: pnpm helper:test
      - run: pnpm helper:build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
