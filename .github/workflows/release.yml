name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --no-frozen-lockfile
      # helper first: tests + self-contained build (release FAILS without it)
      - run: pnpm helper:test
      - run: pnpm helper:build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build and publish Windows release
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
